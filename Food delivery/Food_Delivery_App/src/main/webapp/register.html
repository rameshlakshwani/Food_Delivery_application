<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Gallery | Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ffb347);
}

.container{
    width:1000px;
    height:650px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.left{
    width:45%;
    background:linear-gradient(rgba(255,102,0,.75),rgba(255,140,0,.75)),
    url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    padding:40px;
}

.left h1{
    font-size:42px;
    margin-bottom:20px;
}

.left p{
    font-size:18px;
    line-height:30px;
}

.right{
    width:55%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    width:85%;
}

.form-box h2{
    text-align:center;
    color:#ff6600;
    margin-bottom:25px;
    font-size:34px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

.input-box input,
.input-box textarea,
.input-box select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-box textarea{
    resize:none;
    height:80px;
}

.input-box input:focus,
.input-box textarea:focus,
.input-box select:focus{
    border-color:#ff6600;
    box-shadow:0 0 8px rgba(255,102,0,.3);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#ff6600;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e65c00;
}

.login-link{
    text-align:center;
    margin-top:18px;
}

.login-link a{
    color:#ff6600;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}

@media(max-width:768px){

.container{
    width:95%;
    height:auto;
    flex-direction:column;
}

.left{
    width:100%;
    height:220px;
}

.right{
    width:100%;
    padding:30px 0;
}

}

</style>

</head>
<body>

<div class="container">

    <div class="left">
        <div>
            <h1>🍔 Food Gallery</h1>
            <p>
                Join Food Gallery today and enjoy delicious meals from your
                favorite restaurants delivered right to your doorstep.
            </p>
        </div>
    </div>

    <div class="right">

        <div class="form-box">

            <h2>Create Account</h2>

            <form action="callRegisterServlet" method="post">

                <div class="input-box">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter Username" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter Password" required>
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <div class="input-box">
                    <label>Address</label>
                    <textarea name="address" placeholder="Enter Address" required></textarea>
                </div>

                <div class="input-box">
                    <label>Role</label>
                    <select name="role" required>
    <option value="customer">Customer</option>
    <option value="deliveryagent">Delivery Agent</option>
    <option value="superadmin">Super Admin</option>
</select>
                </div>

                <button type="submit">Create Account</button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login Here</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
