<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Gallery | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ffb347);
}

.container{
    width:950px;
    height:550px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

/* Left Section */

.left{
    width:45%;
    background:
    linear-gradient(rgba(255,102,0,.75),rgba(255,140,0,.75)),
    url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200");
    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
    padding:40px;
}

.left h1{
    font-size:40px;
    margin-bottom:20px;
}

.left p{
    font-size:18px;
    line-height:30px;
}

/* Right Section */

.right{
    width:55%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    width:80%;
}

.form-box h2{
    text-align:center;
    color:#ff6600;
    font-size:34px;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#444;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    border-color:#ff6600;
    box-shadow:0 0 8px rgba(255,102,0,.3);
}

/* Remember Me */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.options a{
    color:#ff6600;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

/* Button */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#ff6600;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e65c00;
}

/* Register */

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#ff6600;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}

/* Responsive */

@media(max-width:768px){

.container{
    width:95%;
    height:auto;
    flex-direction:column;
}

.left{
    width:100%;
    height:220px;
}

.right{
    width:100%;
    padding:35px 0;
}

}

</style>

</head>
<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <div>

            <h1>🍔 Food Gallery</h1>

            <p>
                Welcome Back! Login to explore delicious food from your
                favorite restaurants and enjoy fast delivery.
            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="form-box">

            <h2>Login</h2>

            <form action="callLoginServlet" method="post">

                <div class="input-box">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Register Here
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
